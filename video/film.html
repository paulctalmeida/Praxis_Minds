<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praxis Minds | The film</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../website/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wght@400;500;700&family=Nanum+Pen+Script&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<!--
  Praxis Minds: the film. A 1920x1080 motion piece in the website's style.
  Every frame is a pure function of time (render(t)), so the same file plays live in a browser
  and renders frame by frame to video (see render.js). Text for both languages is in STR below.
  ?lang=pt  Portuguese    ?loop  play on repeat    ?t=42  start at 42 s    ?render  no controls
-->
<style>
:root {
  --paper: #F4F5F8; --sheet: #FFFFFF; --ink: #161B3D; --muted: #565D7E;
  --pen: #2234B5; --on-pen: #FFFFFF; --pen-soft: #E2E6FA;
  --marker: #FFE24A; --on-marker: #161B3D; --rule: #D6DAE6; --hatch: #BEC4D8;
  --panel: #2234B5; --panel-ink: #FFFFFF; --panel-muted: #C7CFFF; --night: #0E1233;
  --font-display: "Archivo", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-pen: "Nanum Pen Script", "Segoe Print", "Bradley Hand", cursive;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #070A22; overflow: hidden; }
body { font-family: var(--font-body); color: var(--ink); -webkit-font-smoothing: antialiased; }
p, h1, h2, h3 { margin: 0; }

#stage {
  position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: hidden;
  background: var(--paper); transform: translate(-50%, -50%) scale(var(--fit, 1));
}
.render #stage { left: 0; top: 0; transform: none; }

/* ---------- Building blocks ---------- */
.scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; visibility: hidden; background-color: var(--paper); box-shadow: 0 0 90px rgba(14, 18, 51, .28); }
.dots { background-image: radial-gradient(circle at 2px 2px, rgba(34, 52, 181, .1) 1.4px, transparent 1.9px); background-size: 48px 48px; }
.cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 960px 540px; }
.a { position: absolute; }
.display { font-family: var(--font-display); font-stretch: 125%; font-weight: 800; letter-spacing: -.02em; color: var(--pen); line-height: .98; }
.mask { display: block; overflow: hidden; padding: .06em .12em .12em; margin: -.06em -.12em -.12em; }
.ln { display: inline-block; white-space: nowrap; }
.label { font-family: var(--font-mono); font-size: 16px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.pen { font-family: var(--font-pen); color: var(--pen); line-height: 1; white-space: nowrap; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; }
.pad { box-shadow: 10px 10px 0 -1px var(--sheet), 10px 10px 0 0 var(--rule); }
.hatch { background: repeating-linear-gradient(135deg, var(--hatch) 0 3px, transparent 3px 10px), var(--sheet); }
.caret { display: inline-block; width: 2px; height: 1.05em; background: currentColor; vertical-align: -.15em; margin-left: 2px; }
.hlw { position: relative; display: inline-block; white-space: nowrap; }
.hlw-top { position: absolute; left: -.08em; top: .02em; bottom: -.02em; padding: 0 .08em; background: var(--marker); color: var(--on-marker); border-radius: .06em .18em .08em .2em; clip-path: inset(0 100% 0 0); }
.hlp { background: linear-gradient(var(--marker), var(--marker)) no-repeat 0 0 / 0% 100%; }
svg.ink path, svg.ink ellipse { fill: none; stroke: var(--pen); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5em; padding: .62em 1.25em;
  border: 2px solid var(--pen); border-radius: 3px; background: var(--pen); color: var(--on-pen);
  font-family: var(--font-display); font-stretch: 112%; font-weight: 700; line-height: 1.2; white-space: nowrap;
}
.btn-marker { background: var(--marker); border-color: var(--marker); color: var(--on-marker); }
.cursor { position: absolute; left: 0; top: 0; width: 40px; height: 52px; z-index: 100; visibility: hidden; filter: drop-shadow(0 5px 8px rgba(22, 27, 61, .3)); }
.ripple { position: absolute; left: 0; top: 0; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; border: 3px solid var(--pen); z-index: 99; visibility: hidden; }

/* chapter label and the In / Out chips, as on the website */
.chap { font-family: var(--font-mono); font-size: 16px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--pen); padding-top: 14px; }
.chap i { position: absolute; left: 0; top: 0; width: 72px; height: 4px; background: var(--pen); transform-origin: left; }
.io { display: grid; gap: 14px; }
.io > div { display: flex; align-items: baseline; gap: 16px; font-size: 22px; line-height: 1.35; }
.io b { flex: none; font-family: var(--font-mono); font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border: 2px solid var(--pen); color: var(--pen); border-radius: 2px; }
.io > div + div b { background: var(--marker); border-color: var(--marker); color: var(--on-marker); }
.io > div + div b::before { content: "→ "; }
.title { font-size: 60px; }
.fine { font-family: var(--font-mono); font-size: 14px; color: var(--muted); letter-spacing: .02em; }

/* ---------- Hook + week ---------- */
.hook-clock { font-weight: 700; font-size: 40px; color: var(--ink); margin-top: 6px; }
.hook-tx { font-size: 104px; margin-top: 18px; }
.card { left: 0; top: 0; overflow: hidden; background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; visibility: hidden; }
.card > div { position: absolute; }
.dm { left: 0; top: 0; width: 260px; height: 340px; padding: 24px 22px; }
.dm-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
.dm-h { font-family: var(--font-display); font-stretch: 125%; font-weight: 800; font-size: 21px; color: var(--ink); text-transform: uppercase; }
.dm-n, .dm-file, .dm-from { font-size: 11px; color: var(--muted); }
.dm-file { display: block; margin-bottom: 14px; padding: 6px 8px; background: var(--paper); border-radius: 2px; }
.dm-subj { display: block; font-size: 16px; color: var(--ink); margin: 6px 0 14px; line-height: 1.25; }
.bar { display: block; height: 8px; background: var(--rule); border-radius: 2px; margin: 0 0 11px; }
.dm-tbl { margin: 18px 0; padding: 12px 0 2px; border-top: 1.5px solid var(--ink); border-bottom: 1px solid var(--rule); }
.dm-sum { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink); }
.dm-sum b { font-size: 16px; }
.dm-grid { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); }
.dm-grid span { height: 26px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font-size: 9px; padding: 6px 4px; font-family: var(--font-mono); color: var(--muted); }
.dm-grid span.h { background: var(--pen-soft); }
.dm-chk { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.dm-chk i { width: 16px; height: 16px; border: 1.5px solid var(--muted); border-radius: 2px; flex: none; }
.dm-chk .bar { margin: 0; flex: 1; }
.dm-folders { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.dm-folders i { height: 50px; border-radius: 3px; background: var(--pen-soft); border: 1.5px solid var(--hatch); }
.dm-chart { display: flex; align-items: flex-end; gap: 10px; height: 120px; margin: 10px 0 18px; border-bottom: 1.5px solid var(--ink); }
.dm-chart i { flex: 1; background: var(--hatch); }
.dm-bubble { padding: 12px; background: var(--paper); border-radius: 10px 10px 10px 2px; margin-bottom: 12px; }
.dm-bubble .bar { margin: 4px 0; }
.card-hatch { inset: 0; background: repeating-linear-gradient(135deg, var(--hatch) 0 3px, transparent 3px 10px), var(--sheet); border: 2px solid var(--hatch); border-radius: 2px; opacity: 0; }
.card-check { inset: 0; background: var(--pen-soft); border: 2px solid var(--pen); border-radius: 2px; opacity: 0; }
.card-lbl { left: 8px; right: 8px; top: 6px; font-size: 15px; font-weight: 600; line-height: 1.2; color: var(--ink); }
.card-lbl .l-now { display: block; }
.card-lbl .l-now span { background: var(--sheet); box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 0 2px; }
.card-lbl .l-after { position: absolute; left: 0; top: 0; color: var(--pen); font-size: 14px; white-space: nowrap; opacity: 0; }
.blk-fixed { background: var(--paper); border: 1px solid var(--rule); color: var(--muted); font-size: 14px; font-weight: 500; padding: 4px 7px; border-radius: 2px; line-height: 1.2; }
.blk-freed { background: var(--marker); color: var(--on-marker); border-radius: 3px 6px 4px 5px; font-family: var(--font-pen); font-size: 30px; line-height: .9; padding: 6px 8px; transform-origin: top; }
.gl { background: var(--rule); transform-origin: left top; }
.hrs { width: 64px; text-align: right; font-size: 13px; color: var(--muted); }
.dayn { font-family: var(--font-mono); font-size: 15px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.seg { display: inline-flex; border: 2px solid var(--pen); border-radius: 4px; overflow: hidden; font-family: var(--font-mono); font-size: 15px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; }
.seg span { position: relative; z-index: 1; padding: 12px 20px; color: var(--pen); }
.seg span + span { border-left: 2px solid var(--pen); }
.seg i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--pen); }
.wk-val { position: relative; display: inline-block; font-weight: 700; font-size: 62px; line-height: 1.2; color: var(--ink); padding: 0 .12em; margin-left: -.12em; }
.wk-val i { position: absolute; inset: 4px 0 2px; background: var(--marker); transform-origin: left; transform: scaleX(0); border-radius: 3px; }
.wk-val span { position: relative; }
.legend { display: grid; gap: 10px; font-size: 19px; color: var(--muted); }
.legend div { display: flex; align-items: center; gap: 12px; }
.sw { width: 34px; height: 20px; flex: none; border: 2px solid var(--hatch); background: var(--sheet); }
.sw-busy { background: repeating-linear-gradient(135deg, var(--hatch) 0 2px, transparent 2px 6px), var(--sheet); }
.sw-check { background: var(--pen-soft); border-color: var(--pen); }
.sw-freed { background: var(--marker); border-color: var(--marker); }

/* ---------- Method ---------- */
.mth-rule { display: block; height: 5px; background: var(--pen); transform-origin: left; margin-bottom: 26px; }
.mth-verb { font-size: 150px; }
.mth-sub { font-size: 30px; font-weight: 600; color: var(--ink); margin-top: 22px; line-height: 1.3; }
.mth-lead { font-size: 40px; font-weight: 500; line-height: 1.35; color: var(--ink); text-wrap: balance; }
.mth-lead span { display: inline-block; }

/* ---------- Header ---------- */
.header { left: 0; top: 0; width: 1920px; height: 130px; z-index: 40; visibility: hidden; }
.brand { left: 120px; top: 46px; display: flex; align-items: center; gap: 12px; font-family: var(--font-display); font-stretch: 125%; font-weight: 800; font-size: 26px; color: var(--pen); letter-spacing: -.01em; }
.brand-mark rect { fill: none; stroke: var(--pen); stroke-width: 1.5; }
.brand-mark rect.on { fill: var(--marker); }
.tabs { right: 120px; top: 44px; display: flex; gap: 10px; }
.tab { font-family: var(--font-mono); font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 9px 14px; border: 1.5px solid var(--rule); border-radius: 3px; color: var(--muted); background: var(--paper); }
.tab b { font-weight: 500; opacity: .7; margin-right: 6px; }
.tab.on { background: var(--pen); border-color: var(--pen); color: var(--on-pen); }
.tab.done { border-color: var(--pen); color: var(--pen); }

/* ---------- Find ---------- */
.f-row { left: 16px; width: 1008px; height: 70px; border-top: 1px solid var(--rule); background: var(--sheet); }
.f-row > * { position: absolute; }
.f-bg { inset: 0; background: var(--pen-soft); opacity: 0; }
.f-rank { left: 12px; top: 17px; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--pen); color: var(--pen); font-size: 15px; font-weight: 700; display: grid; place-items: center; }
.f-task { left: 64px; top: 0; height: 70px; width: 440px; display: flex; align-items: center; font-size: 20px; font-weight: 600; line-height: 1.2; color: var(--ink); }
.f-task span { position: relative; }
.f-task i { position: absolute; left: -6px; right: -6px; top: 2px; bottom: 0; background: var(--marker); transform-origin: left; transform: scaleX(0); border-radius: 2px 5px 3px 4px; }
.f-bar { left: 524px; top: 22px; height: 26px; border: 2px solid var(--hatch); transform-origin: left; }
.f-hrs { top: 22px; font-size: 16px; font-weight: 700; line-height: 26px; color: var(--ink); }
.f-eur { right: 108px; top: 22px; font-size: 17px; font-weight: 700; line-height: 26px; color: var(--ink); }
.f-eff { right: 6px; top: 20px; width: 86px; text-align: center; font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 6px 0; border-radius: 2px; }
.f-eff.low { background: var(--pen-soft); color: var(--pen); }
.f-eff.med { border: 1.5px solid var(--hatch); color: var(--muted); }
.f-head { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.f-total { left: 16px; width: 1008px; top: 700px; height: 64px; border-top: 2.5px solid var(--ink); display: flex; align-items: center; gap: 24px; padding: 0 12px; font-size: 20px; font-weight: 700; }
.f-total .mono { font-size: 22px; }
.chip-ex { font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 5px 10px; background: var(--marker); color: var(--on-marker); border-radius: 2px; }
.stamp { padding: 22px 28px 24px; background: var(--sheet); border: 2.5px dashed var(--pen); }
.stamp .mono { display: block; font-size: 17px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--pen); }
.stamp .pen { display: block; font-size: 40px; margin-top: 8px; }

/* ---------- Document reader ---------- */
.inv { left: 0; top: 0; width: 470px; height: 620px; padding: 30px 32px; transform-origin: 0 0; box-shadow: 0 10px 30px rgba(22, 27, 61, .08); overflow: hidden; }
.inv-h { font-size: 34px; color: var(--ink); }
.inv-num { right: 32px; top: 42px; font-size: 15px; }
.inv .label { font-size: 12px; margin-bottom: 4px; }
.inv-f { position: relative; display: inline-block; isolation: isolate; padding: 0 5px; margin: 0 -5px; }
.inv-f i { position: absolute; inset: -2px 0; z-index: -1; background: var(--marker); transform-origin: left; transform: scaleX(0); border-radius: 2px; }
.inv-sup { font-size: 21px; font-weight: 700; }
.inv-date { font-size: 17px; }
.inv-items { width: 406px; font-size: 15px; border-top: 1.5px solid var(--ink); }
.inv-items div { display: grid; grid-template-columns: 1fr 70px 100px; padding: 9px 0; border-bottom: 1px solid var(--rule); }
.inv-items .mono { text-align: right; font-size: 14px; }
.inv-sums { width: 406px; font-size: 15px; color: var(--muted); }
.inv-sums div { display: flex; justify-content: space-between; padding: 4px 0; }
.inv-total { width: 406px; display: flex; justify-content: space-between; align-items: baseline; padding-top: 10px; border-top: 1.5px solid var(--ink); }
.inv-total .mono { font-size: 25px; font-weight: 700; color: var(--ink); }
.scan { left: 0; width: 100%; height: 120px; background: linear-gradient(to bottom, rgba(34, 52, 181, 0), rgba(34, 52, 181, .14)); border-bottom: 4px solid var(--pen); box-shadow: 0 6px 18px rgba(34, 52, 181, .45); opacity: 0; }
.fly { left: 0; top: 0; z-index: 20; padding: 6px 12px; background: var(--marker); color: var(--on-marker); font-family: var(--font-mono); font-size: 16px; font-weight: 700; border-radius: 3px; white-space: nowrap; box-shadow: 0 8px 20px rgba(22, 27, 61, .2); visibility: hidden; }
.ledger { overflow: hidden; }
.l-row { left: 0; width: 100%; height: 60px; border-top: 1px solid var(--rule); }
.l-row > * { position: absolute; top: 0; line-height: 60px; white-space: nowrap; }
.l-sup { left: 28px; font-size: 19px; font-weight: 600; }
.l-num { left: 350px; font-size: 15px; }
.l-date { left: 580px; font-size: 15px; }
.l-tot { right: 220px; font-size: 17px; font-weight: 700; }
.l-st { left: 906px; top: 15px !important; line-height: 1 !important; font-family: var(--font-mono); font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 8px 12px; border-radius: 2px; background: var(--pen-soft); color: var(--pen); }
.l-st.flag { background: var(--marker); color: var(--on-marker); }
.l-head > * { line-height: 40px; font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

/* ---------- Inbox ---------- */
.mbox { overflow: hidden; }
.mbox-h { left: 0; top: 0; width: 100%; height: 64px; border-bottom: 1.5px solid var(--ink); display: flex; align-items: center; gap: 14px; padding: 0 24px; }
.mbox-h .mono { font-size: 17px; font-weight: 700; color: var(--ink); }
.badge { font-family: var(--font-mono); font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 20px; background: var(--pen); color: var(--on-pen); }
.e-list { left: 0; top: 64px; width: 100%; height: 576px; overflow: hidden; }
.e-row { left: 0; width: 100%; height: 96px; border-bottom: 1px solid var(--rule); background: var(--sheet); }
.e-row > * { position: absolute; white-space: nowrap; }
.e-sel { inset: 0; background: var(--pen-soft); border-left: 5px solid var(--pen); opacity: 0; }
.e-dot { left: 20px; top: 21px; width: 11px; height: 11px; border-radius: 50%; background: var(--pen); }
.e-from { left: 44px; top: 12px; font-size: 20px; font-weight: 700; }
.e-time { right: 22px; top: 15px; font-size: 13px; color: var(--muted); }
.e-tag { right: 98px; top: 12px; font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 5px 9px; border-radius: 2px; }
.t-order { background: var(--pen); color: var(--on-pen); }
.t-quote { background: var(--marker); color: var(--on-marker); }
.t-invoice { border: 1.5px solid var(--pen); color: var(--pen); }
.t-complaint { background: var(--ink); color: #fff; }
.t-question { background: var(--pen-soft); color: var(--pen); }
.t-supplier { border: 1.5px solid var(--hatch); color: var(--muted); }
.e-subj { left: 44px; top: 41px; font-size: 18px; color: var(--ink); }
.e-sum { left: 44px; top: 67px; font-size: 16px; color: var(--muted); font-style: italic; }
.e-sum b { font-style: normal; font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; color: var(--pen); border: 1.5px solid var(--pen); border-radius: 2px; padding: 1px 4px; margin-right: 8px; vertical-align: 2px; }
.ep { padding: 32px; }
.ep-subj { font-family: var(--font-display); font-stretch: 112%; font-weight: 700; font-size: 30px; color: var(--ink); margin: 10px 0 14px; }
.ep-msg { font-size: 20px; line-height: 1.5; color: var(--ink); max-width: 680px; }
.ep-draft { margin-top: 26px; padding: 22px 24px; min-height: 250px; background: var(--pen-soft); border-radius: 3px; }
.ep-draft .label { color: var(--pen); font-weight: 700; margin-bottom: 12px; }
.ep-text { font-size: 20px; line-height: 1.55; color: var(--ink); white-space: pre-line; }
.ep-btn { font-size: 22px; margin-top: 26px; }

/* ---------- Dashboard ---------- */
.src { left: 120px; width: 300px; height: 62px; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--sheet); border: 1.5px solid var(--rule); border-radius: 3px; font-size: 20px; font-weight: 600; }
.src svg { width: 30px; height: 30px; flex: none; fill: none; stroke: var(--pen); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dash { overflow: hidden; }
.dash-date { font-family: var(--font-display); font-stretch: 112%; font-weight: 700; font-size: 26px; color: var(--ink); display: flex; align-items: center; gap: 16px; }
.live { right: 28px; top: 34px; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.live i { width: 11px; height: 11px; border-radius: 50%; background: var(--pen); }
.tile { border-radius: 3px; }
.tile > * { position: absolute; }
.t-ph { inset: 0; border: 2px dashed var(--hatch); border-radius: 3px; display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; color: var(--hatch); font-weight: 700; }
.t-solid { inset: 0; background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; opacity: 0; }
.t-c { inset: 0; opacity: 0; }
.t-c > * { position: absolute; }
.t-lbl { left: 18px; top: 16px; font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

    var s = scenes[i], on = t >= s.a && t < s.b;
    show(s.root, on);
    if (on) s.update(t);
  }
  header.update(t);
  wipe.update(t);
}

function layoutAll() {
  scenes.forEach(function (s) { if (s.measureText) s.measureText(); });
  scenes.forEach(function (s) { if (s.layout) s.layout(); });
}

function fit() {
  var k = Math.min(innerWidth / W, innerHeight / H);
  stage.style.setProperty("--fit", k);
}

var ready = Promise.all([
  document.fonts.load('800 100px "Archivo"', "Praxis Minds"),
  document.fonts.load('700 30px "Martian Mono"', "0123 €"),
  document.fonts.load('400 30px "Martian Mono"', "0123 €"),
  document.fonts.load('600 20px "Public Sans"', "práxis ação"),
  document.fonts.load('italic 400 20px "Public Sans"', "ação"),
  document.fonts.load('400 40px "Nanum Pen Script"', "práxis ação é")
]).catch(function () {}).then(function () { return document.fonts.ready; });

ready.then(function () {
  layoutAll();
  if (RENDER) {
    window.__duration = DURATION;
    window.__seek = function (t) { render(t); };
    render(0);
    window.__ready = true;
    return;
  }
  fit();
  addEventListener("resize", fit);
  var play = document.getElementById("c-play"), seek = document.getElementById("c-seek"), time = document.getElementById("c-time"), bar = document.getElementById("controls");
  document.getElementById(LANG === "pt" ? "c-pt" : "c-en").className = "on";
  $$(bar, "a").forEach(function (a) { a.href += LOOP ? "&loop" : ""; });
  seek.max = DURATION;
  var playing = true, tNow = parseFloat(Q.get("t")) || 0, last = performance.now();
  function fmtT(x) { x = Math.floor(x); return Math.floor(x / 60) + ":" + pad2(x % 60); }
  function setPlaying(p) {
    if (p && tNow >= DURATION) tNow = 0;
    playing = p; play.textContent = p ? "Pause" : "Play"; last = performance.now();
  }
  play.addEventListener("click", function () { setPlaying(!playing); });
  stage.addEventListener("click", function () { setPlaying(!playing); });
  seek.addEventListener("input", function () { tNow = parseFloat(seek.value); render(tNow); });
  addEventListener("keydown", function (e) {
    if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
    if (e.key === "ArrowRight") tNow = Math.min(DURATION, tNow + 3);
    if (e.key === "ArrowLeft") tNow = Math.max(0, tNow - 3);
  });
  var idle;
  addEventListener("mousemove", function () { bar.classList.remove("idle"); clearTimeout(idle); idle = setTimeout(function () { bar.classList.add("idle"); }, 2200); });
  idle = setTimeout(function () { bar.classList.add("idle"); }, 2200);
  function tick(now) {
    if (playing) {
      tNow += Math.min(.1, (now - last) / 1000);
      if (tNow >= DURATION) {
        if (LOOP) tNow = 0; else { tNow = DURATION; setPlaying(false); }
      }
    }
    last = now;
    render(tNow);
    seek.value = tNow;
    time.textContent = fmtT(tNow) + " / " + fmtT(DURATION);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
});
})();
</script>
</body>
