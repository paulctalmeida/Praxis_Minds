<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praxis Minds | The film</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Plus+Jakarta+Sans:wght@400..800&display=swap">
<!--
  Praxis Minds: the film. A 1920x1080 motion piece built on the website design
  (https://claude.ai/artifact/9Lms1UPDn7ZYY25LgYHe4y): warm paper, deep teal, coral,
  Plus Jakarta Sans with one Instrument Serif italic per headline, and the line-drawn logo.
  Every frame is a pure function of time (render(t)), so the same file plays live in a browser
  and renders frame by frame to video (see render.js). Text for both languages is in STR below.
  ?lang=pt  Portuguese    ?loop  play on repeat    ?t=42  start at 42 s    ?render  no controls
-->
<style>
:root {
  --bg: #F7F6F2; --surface: #FFFFFF; --surface-2: #EFEDE7;
  --ink: #0F1F1D; --ink-2: #2B3B39; --muted: #5B6B68; --line: #E2DFD7; --line-strong: #CBC7BC;
  --brand: #0D5C55; --brand-soft: #E0EEEA; --on-brand: #FFFFFF; --brand-light: #5FCBB8;
  --accent: #EF6C4D; --on-accent: #1E0F0A; --accent-ink: #B4442B; --accent-soft: #FCE7DF;
  --deep: #0B2724; --deep-2: #134440; --on-deep: #F1F6F5; --on-deep-muted: #A9C3BE; --accent-on-deep: #FF9375;
  --shadow-xs: 0 1px 2px rgba(15, 31, 29, .06);
  --shadow-sm: 0 1px 2px rgba(15, 31, 29, .05), 0 6px 18px -6px rgba(15, 31, 29, .12);
  --shadow-md: 0 2px 4px rgba(15, 31, 29, .04), 0 24px 50px -20px rgba(15, 31, 29, .24);
  --shadow-lg: 0 2px 6px rgba(15, 31, 29, .04), 0 44px 100px -40px rgba(15, 31, 29, .36);
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #050E0D; overflow: hidden; }
body { font-family: var(--font-sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
p, h1, h2, h3, h4 { margin: 0; }

#stage {
  position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: hidden;
  background: var(--bg); transform: translate(-50%, -50%) scale(var(--fit, 1));
}
.render #stage { left: 0; top: 0; transform: none; }

/* ---------- Building blocks (the website's components, at film size) ---------- */
.scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; visibility: hidden; background-color: var(--bg); box-shadow: 0 0 120px rgba(11, 39, 36, .3); }
.deep { background: linear-gradient(160deg, var(--deep-2), var(--deep) 60%); color: var(--on-deep); }
.cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 960px 540px; }
.a { position: absolute; }
.fx { position: absolute; inset: 0; pointer-events: none; }
.grid { position: absolute; inset: 0; opacity: .6; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 72px 72px; }
.blob { position: absolute; border-radius: 50%; }
.h { font-weight: 800; letter-spacing: -.04em; line-height: 1.04; color: var(--ink); }
.h em { position: relative; font-family: var(--font-serif); font-style: italic; font-weight: 400; font-size: 1.1em; line-height: .9; letter-spacing: -.01em; color: var(--brand); }
.deep .h { color: var(--on-deep); }
.deep .h em { color: var(--accent-on-deep); }
.mask { display: block; overflow: hidden; padding: .1em .14em .32em; margin: -.1em -.14em -.32em; }
.ln { display: inline-block; white-space: nowrap; }
.scribble { position: absolute; left: -.02em; bottom: -.12em; width: 100%; height: .26em; overflow: visible; }
.scribble path { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.kicker { display: inline-flex; align-items: center; gap: 16px; font-size: 18px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--brand); white-space: nowrap; }
.kicker::before { content: ""; width: 34px; height: 3px; border-radius: 2px; background: var(--accent); }
.deep .kicker { color: var(--accent-on-deep); }
.lead { font-size: 27px; line-height: 1.55; color: var(--ink-2); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow-lg); }
.card-sm { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow-md); }
.glass { background: rgba(255, 255, 255, .045); border: 1px solid rgba(255, 255, 255, .1); border-radius: 28px; }
.ic { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tile { display: grid; place-items: center; width: 64px; height: 64px; flex: none; border-radius: 18px; background: var(--brand-soft); color: var(--brand); }
.tile .ic { width: 32px; height: 32px; }
.tile-sm { width: 48px; height: 48px; border-radius: 14px; }
.tile-sm .ic { width: 25px; height: 25px; }
.deep .tile { background: rgba(255, 255, 255, .08); color: var(--accent-on-deep); }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 18px; font-weight: 650; line-height: 1.3; white-space: nowrap; }
.pill .ic { width: 19px; height: 19px; }
.pill-brand { background: var(--brand-soft); color: var(--brand); }
.pill-accent { background: var(--accent-soft); color: var(--accent-ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 18px 34px; border-radius: 999px; background: var(--brand); color: var(--on-brand); font-size: 24px; font-weight: 650; line-height: 1.2; white-space: nowrap; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), var(--shadow-xs); }
.btn .ic { width: 26px; height: 26px; }
.btn-accent { background: var(--accent); color: var(--on-accent); }
.badge { display: inline-flex; align-items: center; gap: 12px; padding: 10px 22px 10px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-sm); font-size: 21px; font-weight: 600; line-height: 1.4; color: var(--ink-2); white-space: nowrap; }
.dot { position: relative; width: 11px; height: 11px; flex: none; border-radius: 50%; background: var(--accent); }
.dot i { position: absolute; inset: 0; border-radius: 50%; background: var(--accent); }
.io { display: grid; gap: 12px; padding-top: 18px; border-top: 1.5px dashed var(--line-strong); }
.io > div { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: baseline; font-size: 22px; line-height: 1.45; color: var(--ink-2); }
.io b { font-size: 14px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.io > div + div b { color: var(--accent-ink); }
.caret { display: inline-block; width: 2px; height: 1.05em; background: currentColor; vertical-align: -.15em; margin-left: 2px; }
.hlp { background: linear-gradient(var(--accent-soft), var(--accent-soft)) no-repeat 0 0 / 0% 100%; }
svg.loop path { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; }
.cursor { position: absolute; left: 0; top: 0; width: 40px; height: 52px; z-index: 100; visibility: hidden; filter: drop-shadow(0 5px 8px rgba(15, 31, 29, .3)); }
.ripple { position: absolute; left: 0; top: 0; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; border: 3px solid var(--brand); z-index: 99; visibility: hidden; }
.fine { font-size: 17px; line-height: 1.5; color: var(--muted); }

/* ---------- Hook ---------- */
.hook-tx { font-size: 104px; margin-top: 22px; }
.pcard { left: 0; top: 0; overflow: hidden; visibility: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; }
.pcard > .dm { position: absolute; left: 0; top: 0; width: 260px; height: 340px; padding: 22px; }
.pcard > .to-bar { position: absolute; inset: 0; background: var(--brand); opacity: 0; }
.dm-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.dm-top .pill { font-size: 12px; padding: 4px 10px; }
.dm-t { display: block; font-size: 19px; font-weight: 750; letter-spacing: -.02em; color: var(--ink); margin-bottom: 14px; line-height: 1.25; }
.bar { display: block; height: 9px; border-radius: 99px; background: var(--surface-2); margin: 0 0 11px; }
.dm-sum { display: flex; justify-content: space-between; align-items: baseline; margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); font-weight: 600; }
.dm-sum b { font-size: 18px; color: var(--ink); font-weight: 750; }
.dm-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.dm-grid span { height: 24px; border-radius: 5px; background: var(--surface-2); font-size: 9px; padding: 6px 4px; color: var(--muted); font-weight: 600; }
.dm-grid span.h { background: var(--brand-soft); }
.dm-chart { display: flex; align-items: flex-end; gap: 9px; height: 110px; margin: 6px 0 18px; }
.dm-chart i { flex: 1; border-radius: 6px 6px 2px 2px; background: var(--brand-soft); }
.dm-chart i:nth-child(4) { background: var(--brand); }
.dm-bub { padding: 12px; background: var(--surface-2); border-radius: 14px 14px 14px 4px; margin-bottom: 12px; }
.dm-bub.me { background: var(--brand-soft); border-radius: 14px 14px 4px 14px; margin-left: 30px; }
.dm-bub .bar { margin: 4px 0; background: rgba(15, 31, 29, .08); }
.dm-files { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.dm-files i { height: 54px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }

/* ---------- Example week (the website's hero card) ---------- */
.week { left: 900px; top: 118px; width: 900px; padding: 44px 48px 36px; }
.week-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.week-title { display: flex; align-items: center; gap: 12px; font-size: 23px; font-weight: 650; color: var(--ink-2); }
.week-title .ic { width: 28px; height: 28px; color: var(--brand); }
.seg { position: relative; display: inline-grid; grid-template-columns: 1fr 1fr; padding: 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); }
.seg i { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc(50% - 6px); border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-sm); }
.seg span { position: relative; z-index: 1; padding: 12px 26px; font-size: 21px; font-weight: 650; text-align: center; white-space: nowrap; color: var(--muted); }
.wstats { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin: 32px 0 36px; }
.wstats > div { position: relative; overflow: hidden; padding: 20px 24px; border-radius: 22px; background: var(--surface-2); }
.wstats > div > em { position: absolute; inset: 0; background: var(--accent-soft); opacity: 0; }
.wstats dt { position: relative; display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 600; color: var(--muted); }
.wstats dt::before { content: ""; width: 14px; height: 14px; border-radius: 4px; background: var(--brand); }
.wstats .back dt::before { background: var(--accent); }
.wstats dd { position: relative; margin: 4px 0 0; font-size: 46px; font-weight: 750; letter-spacing: -.03em; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wrows { display: grid; gap: 22px; }
.wrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 10px 20px; }
.wtask { font-size: 22px; font-weight: 550; line-height: 1.35; color: var(--ink-2); white-space: nowrap; }
.wtime { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wtime s { margin-right: 10px; color: var(--muted); font-weight: 500; text-decoration-thickness: 2px; }
.wbar { grid-column: 1 / -1; position: relative; display: block; height: 14px; overflow: hidden; border-radius: 999px; background: var(--accent); }
.wfill { position: absolute; inset: 0 auto 0 0; width: 100%; border-radius: 999px; background: var(--brand); }
.week figcaption { margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--line); font-size: 18px; color: var(--muted); }
.ticks { display: flex; flex-wrap: wrap; gap: 14px 34px; font-size: 22px; font-weight: 550; color: var(--muted); }
.ticks span { display: inline-flex; align-items: center; gap: 12px; }
.ticks .ic { width: 30px; height: 30px; padding: 5px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); stroke-width: 2.6; }

/* ---------- Method ---------- */
.step { width: 520px; height: 370px; padding: 40px; display: flex; flex-direction: column; gap: 18px; }
.step-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.step-top .tile { width: 80px; height: 80px; border-radius: 22px; }
.step-top .tile .ic { width: 40px; height: 40px; }
.step-num { font-size: 20px; font-weight: 700; letter-spacing: .1em; color: var(--on-deep-muted); }
.step h3 { font-size: 72px; font-weight: 800; letter-spacing: -.04em; line-height: 1.05; color: var(--on-deep); white-space: nowrap; }
.step p { font-size: 25px; line-height: 1.5; color: var(--on-deep-muted); }
.step-arrow { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .2); background: var(--deep); color: var(--brand-light); z-index: 2; }
.step-arrow .ic { width: 26px; height: 26px; stroke-width: 2.2; }

/* ---------- Header ---------- */
.header { left: 0; top: 0; width: 1920px; height: 130px; z-index: 40; visibility: hidden; }
.brand { left: 120px; top: 42px; display: flex; align-items: center; gap: 14px; }
.brand .logo { width: 58px; height: 49px; overflow: visible; }
.logo path { fill: none; stroke: var(--brand); stroke-width: 3.8; stroke-linecap: round; stroke-linejoin: round; }
.brand-name { font-size: 20px; font-weight: 750; letter-spacing: .14em; line-height: 1; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
.brand-name span { font-weight: 550; color: var(--brand); }
.header.dark .brand-name { color: var(--on-deep); }
.header.dark .brand-name span { color: var(--brand-light); }
.header.dark .logo path { stroke: var(--brand-light); }
.tabs { right: 120px; top: 38px; display: flex; padding: 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-xs); }
.tabs .ind { position: absolute; top: 6px; bottom: 6px; left: 0; border-radius: 999px; background: var(--brand); box-shadow: 0 8px 18px -8px var(--brand); }
.tab { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px; border-radius: 999px; font-size: 18px; font-weight: 650; color: var(--muted); white-space: nowrap; }
.tab b { font-weight: 700; opacity: .6; }
.tab .ic { width: 18px; height: 18px; stroke-width: 2.6; display: none; color: var(--brand); }
.tab.on { color: var(--on-brand); }
.tab.done .ic { display: inline; }
.tab.done { color: var(--ink-2); }

/* ---------- Find ---------- */
.f-row { left: 16px; width: 1008px; height: 86px; background: var(--surface); border-radius: 18px; }
.f-row > * { position: absolute; }
.f-bg { inset: 6px 0; border-radius: 18px; background: var(--brand-soft); opacity: 0; }
.f-hl { inset: 6px 0; border-radius: 18px; background: var(--accent-soft); transform-origin: left; transform: scaleX(0); }
.f-rule { left: 12px; right: 12px; top: 0; height: 1px; background: var(--line); }
.f-rank { left: 18px; top: 21px; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-size: 18px; font-weight: 750; color: var(--ink-2); background: var(--surface); }
.f-rank.top { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.f-task { left: 84px; top: 0; height: 86px; width: 420px; display: flex; align-items: center; font-size: 21px; font-weight: 550; line-height: 1.3; color: var(--ink-2); }
.f-bar { left: 520px; top: 34px; height: 18px; border-radius: 999px; background: var(--brand); transform-origin: left; }
.f-hrs { top: 28px; font-size: 19px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.f-eur { right: 140px; top: 27px; font-size: 21px; font-weight: 750; color: var(--ink); white-space: nowrap; }
.f-eff { right: 16px; top: 24px; }
.f-eff.pill { font-size: 15px; padding: 6px 14px; }
.f-head { font-size: 15px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.f-total { left: 28px; right: 28px; top: 700px; height: 70px; border-top: 1.5px solid var(--line-strong); display: flex; align-items: center; gap: 18px; font-size: 21px; font-weight: 650; color: var(--muted); }
.f-total b { font-size: 26px; font-weight: 800; letter-spacing: -.02em; color: var(--ink); }
.plan { width: 560px; padding: 32px 34px; border-radius: 28px; background: linear-gradient(165deg, var(--deep-2), var(--deep) 55%); color: var(--on-deep); box-shadow: var(--shadow-lg); overflow: hidden; }
.plan .tag { display: inline-flex; align-items: center; gap: 10px; padding: 7px 16px 7px 12px; border: 1px solid rgba(255, 255, 255, .14); border-radius: 999px; background: rgba(255, 255, 255, .06); font-size: 18px; font-weight: 650; }
.plan h3 { margin-top: 18px; font-size: 34px; font-weight: 750; letter-spacing: -.03em; }

/* ---------- Document reader ---------- */
.inv { left: 0; top: 0; width: 470px; height: 620px; padding: 30px 32px; transform-origin: 0 0; overflow: hidden; }
.inv-h { font-size: 32px; font-weight: 800; letter-spacing: -.03em; }
.inv-num { right: 32px; top: 40px; font-size: 16px; font-weight: 650; color: var(--ink-2); }
.inv .lab { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.inv-f { position: relative; display: inline-block; isolation: isolate; padding: 0 6px; margin: 0 -6px; }
.inv-f i { position: absolute; inset: -3px 0; z-index: -1; background: var(--brand-soft); border: 1.5px solid var(--brand); border-radius: 8px; transform-origin: left; transform: scaleX(0); }
.inv-sup { font-size: 21px; font-weight: 700; }
.inv-date { font-size: 18px; font-weight: 600; }
.inv-items { width: 406px; font-size: 15px; border-top: 1.5px solid var(--ink); }
.inv-items div { display: grid; grid-template-columns: 1fr 70px 100px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.inv-items span + span { text-align: right; font-variant-numeric: tabular-nums; }
.inv-sums { width: 406px; font-size: 15px; color: var(--muted); }
.inv-sums div { display: flex; justify-content: space-between; padding: 4px 0; }
.inv-total { width: 406px; display: flex; justify-content: space-between; align-items: baseline; padding-top: 10px; border-top: 1.5px solid var(--ink); }
.inv-total .inv-f { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.scan { left: 0; width: 100%; height: 120px; background: linear-gradient(to bottom, rgba(95, 203, 184, 0), rgba(95, 203, 184, .22)); border-bottom: 4px solid var(--brand); box-shadow: 0 6px 22px rgba(13, 92, 85, .4); opacity: 0; }
.fly { left: 0; top: 0; z-index: 20; padding: 7px 16px; border-radius: 999px; background: var(--brand); color: var(--on-brand); font-size: 17px; font-weight: 700; white-space: nowrap; box-shadow: 0 10px 24px -8px rgba(13, 92, 85, .6); visibility: hidden; }
.ledger { overflow: hidden; }
.card-head { display: flex; align-items: center; gap: 16px; }
.card-head h3 { font-size: 24px; font-weight: 750; letter-spacing: -.02em; white-space: nowrap; }
.l-row { left: 0; width: 100%; height: 58px; border-top: 1px solid var(--line); }
.l-row > * { position: absolute; top: 0; line-height: 58px; white-space: nowrap; }
.l-sup { left: 30px; font-size: 19px; font-weight: 650; }
.l-num { left: 350px; font-size: 17px; color: var(--ink-2); }
.l-date { left: 580px; font-size: 17px; color: var(--ink-2); }
.l-tot { right: 230px; font-size: 18px; font-weight: 750; }
.l-st { left: 900px; top: 11px !important; line-height: 1.3 !important; }
.l-st.pill { font-size: 15px; padding: 6px 14px; }
.l-head > * { line-height: 40px; font-size: 14px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.callout { z-index: 30; }

/* ---------- Inbox ---------- */
.mbox, .chat { overflow: hidden; }
.e-list { left: 0; top: 96px; width: 100%; height: 544px; overflow: hidden; }
.e-row { left: 0; width: 100%; height: 108px; border-top: 1px solid var(--line); background: var(--surface); }
.e-row > * { position: absolute; white-space: nowrap; }
.e-sel { inset: 0; background: var(--brand-soft); opacity: 0; }
.e-av { left: 26px; top: 22px; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); font-size: 18px; font-weight: 750; }
.e-dot { left: 10px; top: 44px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.e-from { left: 96px; top: 16px; font-size: 20px; font-weight: 750; }
.e-time { right: 26px; top: 19px; font-size: 15px; font-weight: 600; color: var(--muted); }
.e-tag { right: 98px; top: 14px; }
.e-tag.pill { font-size: 13px; padding: 4px 11px; }
.t-dark { background: var(--deep); color: var(--on-deep); }
.e-subj { left: 96px; top: 45px; font-size: 18px; color: var(--ink-2); font-weight: 550; }

   SCENE 12 · Logo: drawn as one line, then the name and "AI, put into practice."
   ===================================================================== */
(function () {
  var s = addScene("logo", 85.5, DURATION + 1, 59, "", null, null);
  var c = s.cam, Lg = L.logo;
  var bg = makeBg(c, { grid: "50% 45%", blobs: [[1300, -300, 1000, "teal"], [-260, 500, 900, "coral"]] });
  var markBox = el('<div class="a" style="left:0;top:0;width:420px;height:355px;transform-origin:0 0"></div>', c);
  markBox.innerHTML = logoSvg() + logoSvg();
  var mark = markBox.children[0], trail = markBox.children[1];
  [mark, trail].forEach(function (m) { m.style.position = "absolute"; m.style.left = "0"; m.style.top = "0"; m.style.width = "420px"; m.style.height = "355px"; m.style.overflow = "visible"; });
  var parts = $$(mark, "path"), trails = $$(trail, "path");
  trails.forEach(function (p) { p.style.stroke = "var(--accent)"; p.style.strokeWidth = "4.6"; });
  var tip = el('<div class="a" style="left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 6px rgba(239,108,77,.18);visibility:hidden"></div>', c);
  var word = el('<div class="a word">' + "PRAXIS MINDS".split("").map(function (ch, i) { return '<span class="mask" style="display:inline-block;padding:.1em 0 .2em;margin:-.1em 0 -.2em"><span class="ln"' + (i > 6 ? ' style="font-weight:550;color:var(--brand)"' : "") + ">" + (ch === " " ? "&nbsp;" : ch) + "</span></span>"; }).join("") + "</div>", c);
  var letters = $$(word, ".ln");
  var tag = el('<div class="a h tagline">' + lines(Lg.tag) + "</div>", c);
  var tagScr = addScribble(tag);
  var foot = el('<div class="a foot-line"><span><em>Práxis</em> ' + esc(Lg.note) + "</span><i></i><b>" + esc(Lg.url) + "</b></div>", c);
  /* a steady pen: each piece takes time in proportion to its length, 2.4 s in all, as on the website */
  var DUR = [.1, .24, 1.53, .53], START = [], acc = 86.0;
  DUR.forEach(function (d) { START.push(acc); acc += d; });
  var geo = { fx: 600, fy: 320, fs: .5, len: [] };
  s.layout = function () {
    var ww = word.offsetWidth, MS = 200, GAP = 40, total = MS + GAP + ww;
    geo.fx = 960 - total / 2; geo.fy = 400 - MS * 76 / 90 / 2; geo.fs = MS / 420;
    word.style.left = (geo.fx + MS + GAP) + "px"; word.style.top = (400 - word.offsetHeight / 2 + 4) + "px";
    tag.style.left = (960 - tag.offsetWidth / 2) + "px"; tag.style.top = "540px";
    foot.style.left = (960 - foot.offsetWidth / 2) + "px"; foot.style.top = "770px";
    geo.len = parts.map(function (p) { return p.getTotalLength(); });
  };
  s.update = function (t) {
    bg.update(t);
    /* the mark: centred and large while it draws, then smaller and to the left of the name */
    var m = P(t, 88.55, .9, E.inOut4);
    var sc = lerp(1, geo.fs, m) * (1 + Math.sin(Math.PI * clamp((t - 88.3) / .35)) * .04);
    var x = lerp(960 - 210, geo.fx, m), y = lerp(470 - 177, geo.fy, m);
    tr(markBox, x, y, sc);
    var unit = sc * 420 / 90, tipOn = false;
    parts.forEach(function (p, i) {
      var k = clamp((t - START[i]) / DUR[i]);
      st(p, "strokeDasharray", "1 1"); st(p, "strokeDashoffset", String(1 - k));
      if (k > 0 && k < 1) {
        var pt = p.getPointAtLength(geo.len[i] * k);
        tipOn = true;
        tr(tip, x + (pt.x - 5.5) * unit, y + (pt.y - 8.5) * unit);
      }
    });
    vis(tip, tipOn);
    letters.forEach(function (ln, i) { st(ln, "transform", "translateY(" + f2((1 - P(t, 89.0 + i * .035, .7, E.outExpo)) * 115) + "%)"); });
    revealLines(tag, t, 89.7, undefined, .1, .9);
    draw(tagScr, P(t, 90.35, 1.1, E.inOut));
    rise(foot, t, 90.9, .8, 20);
    /* a coral light runs once along the line, like the website's hover colour */
    var g = clamp((t - 91.7) / 1.4), LEN = .22;
    trails.forEach(function (p, i) {
      var u = (g - i / 4) * 4, hd = clamp(u), tl = clamp(u - LEN);
      st(p, "strokeDasharray", f2(Math.max(0, hd - tl)) + " 2");
      st(p, "strokeDashoffset", f2(-tl));
      op(p, g > 0 && u > 0 && tl < 1 ? 1 : 0);
    });
    st(c, "transform", "scale(" + f2(1 + .025 * P(t, 89, 4.5, E.out)) + ")");
  };
})();

/* =====================================================================
   Render loop and player
   ===================================================================== */
function render(t) {
  for (var i = 0; i < scenes.length; i++) {
    var s = scenes[i], on = t >= s.a && t < s.b;
    show(s.root, on);
    if (on) s.update(t);
  }
  header.update(t);
}

function layoutAll() {
  scenes.forEach(function (s) { if (s.measureText) s.measureText(); });
  scenes.forEach(function (s) { if (s.layout) s.layout(); });
  header.layout();
}

function fit() { stage.style.setProperty("--fit", Math.min(innerWidth / W, innerHeight / H)); }

var ready = Promise.all([
  document.fonts.load('800 100px "Plus Jakarta Sans"', "Praxis Minds"),
  document.fonts.load('550 30px "Plus Jakarta Sans"', "práxis ação"),
  document.fonts.load('italic 400 100px "Instrument Serif"', "práxis ação")
]).catch(function () {}).then(function () { return document.fonts.ready; });

ready.then(function () {
  layoutAll();
  if (RENDER) {
    window.__duration = DURATION;
    window.__seek = function (t) { render(t); };
    render(0);
    window.__ready = true;
    return;
  }
  fit();
  addEventListener("resize", fit);
  var play = document.getElementById("c-play"), seek = document.getElementById("c-seek"), time = document.getElementById("c-time"), bar = document.getElementById("controls");
  document.getElementById(LANG === "pt" ? "c-pt" : "c-en").className = "on";
  $$(bar, "a").forEach(function (a) { a.href += LOOP ? "&loop" : ""; });
  seek.max = DURATION;
  var playing = true, tNow = parseFloat(Q.get("t")) || 0, last = performance.now();
  function fmtT(x) { x = Math.floor(x); return Math.floor(x / 60) + ":" + pad2(x % 60); }
  function setPlaying(p) {
    if (p && tNow >= DURATION) tNow = 0;
    playing = p; play.textContent = p ? "Pause" : "Play"; last = performance.now();
  }
  play.addEventListener("click", function () { setPlaying(!playing); });
  stage.addEventListener("click", function () { setPlaying(!playing); });
  seek.addEventListener("input", function () { tNow = parseFloat(seek.value); render(tNow); });
  addEventListener("keydown", function (e) {
    if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
    if (e.key === "ArrowRight") tNow = Math.min(DURATION, tNow + 3);
    if (e.key === "ArrowLeft") tNow = Math.max(0, tNow - 3);
  });
  var idle;
  addEventListener("mousemove", function () { bar.classList.remove("idle"); clearTimeout(idle); idle = setTimeout(function () { bar.classList.add("idle"); }, 2200); });
  idle = setTimeout(function () { bar.classList.add("idle"); }, 2200);
  function tick(now) {
    if (playing) {
      tNow += Math.min(.1, (now - last) / 1000);
      if (tNow >= DURATION) { if (LOOP) tNow = 0; else { tNow = DURATION; setPlaying(false); } }
    }
    last = now;
    render(tNow);
    seek.value = tNow;
    time.textContent = fmtT(tNow) + " / " + fmtT(DURATION);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
});
})();
</script>
